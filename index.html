<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's Up Tonight?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070a18; --panel:#0f1430; --line:#222a55; --ink:#e6eaff; --dim:#8d97c9; --gold:#ffd27a; --blue:#8fa8ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(1200px 700px at 50% -10%, #1a1f4d 0%, var(--bg) 65%); color:var(--ink);
         font-family:'Space Grotesk', system-ui, sans-serif; min-height:100vh; }
  button, select { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:7px 14px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--blue); }
  header { max-width:1150px; margin:0 auto; padding:24px 20px 6px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  h1 { margin:0; font-size:30px; letter-spacing:-0.5px; margin-right:auto; }
  h1 em { font-family:'Fraunces', serif; color:var(--gold); font-weight:500; }
  .bar { max-width:1150px; margin:0 auto; padding:8px 20px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; }
  #nights { display:flex; gap:6px; flex-wrap:wrap; }
  .pill { font-size:13px; padding:5px 12px; } .pill.on { border-color:var(--gold); background:#1d2354; }
  #status { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:#c4cbf0; align-items:center; }
  .badge { font-weight:700; padding:3px 10px; border-radius:999px; }
  .great { background:#163d2a; color:#7ef0ad; } .ok { background:#3d3416; color:#f0d27e; } .bad { background:#3d1a1a; color:#f09a7e; }
  main { max-width:1150px; margin:0 auto; padding:10px 20px 30px; display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:24px; align-items:start; }
  @media (max-width:880px) { main { grid-template-columns:1fr; } }
  .skybox { position:relative; }
  canvas { width:100%; max-width:680px; aspect-ratio:1; display:block; margin:0 auto; cursor:grab; touch-action:none; }
  #tip { position:absolute; pointer-events:none; background:#ffd27a; color:#141833; font-weight:700; font-size:12px; padding:3px 8px; border-radius:6px; white-space:nowrap; }
  .controls { display:flex; align-items:center; gap:12px; max-width:680px; margin:6px auto 0; }
  #clock { font-weight:700; font-size:20px; min-width:150px; }
  input[type=range] { flex:1; accent-color:var(--gold); }
  #play { width:42px; height:42px; padding:0; font-size:15px; }
  .hint { text-align:center; font-size:12px; color:var(--dim); margin-top:6px; }
  aside { position:sticky; top:16px; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tab { flex:1; font-weight:600; } .tab.on { background:var(--gold); color:#141833; border-color:var(--gold); }
  #card { background:rgba(15,20,48,0.8); border:1px solid var(--line); border-radius:18px; padding:18px; min-height:240px; }
  .kicker { text-transform:uppercase; letter-spacing:1.5px; font-size:11px; color:var(--gold); }
  #card h2 { margin:6px 0 10px; font-size:24px; }
  #card p { font-size:14px; line-height:1.5; color:#cdd3f5; margin:0 0 12px; }
  .muted { color:var(--dim) !important; }
  .where { color:var(--ink) !important; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:13px; padding:5px 11px; }
  .chip:hover { background:#1d2354; }
  .row { display:flex; gap:8px; }
  .primary { background:var(--gold); color:#141833; border-color:var(--gold); font-weight:700; }
  .feedback { min-height:20px; } .feedback.good { color:#7ef0ad !important; }
  footer { max-width:1150px; margin:0 auto; color:var(--dim); font-size:11px; padding:0 20px 24px; }
  footer a { color:var(--blue); }
</style>
</head>
<body>
<header>
  <h1>What's up <em>tonight?</em></h1>
  <select id="city" aria-label="Location"></select>
  <button id="locate">📍 Use my location</button>
</header>
<div class="bar"><div id="nights"></div><div id="status"></div></div>

<main>
  <section>
    <div class="skybox">
      <canvas id="sky"></canvas>
      <div id="tip" hidden></div>
    </div>
    <div class="controls">
      <button id="play" title="Time-lapse">▶</button>
      <div id="clock"></div>
      <input type="range" id="time" aria-label="Time of night">
    </div>
    <div class="hint">Hover to identify · drag the sky sideways to move through the night · click for details</div>
  </section>

  <aside>
    <div class="tabs">
      <button class="tab on" data-mode="explore">🔭 Explore</button>
      <button class="tab" data-mode="play">🎯 Find it!</button>
    </div>
    <div id="card"></div>
  </aside>
</main>

<footer>
  Star data: <a href="https://github.com/ofrohn/d3-celestial">d3-celestial</a> (Hipparcos catalogue, BSD) ·
  Clouds: <a href="https://open-meteo.com/">Open-Meteo API</a> · Positions computed in your browser
</footer>

<script src="data/sky-data.js"></script>
<script src="facts.js"></script>
<script src="astro.js"></script>
<script src="app.js"></script>
</body>
</html>
